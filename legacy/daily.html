<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
  <title>Daily Words - Stay Here</title>
</head>

<body class="relative bg-white scroll-smooth min-h-screen flex flex-col">

  <!-- BACKGROUND GLOW -->
  <div class="fixed inset-0 -z-10 pointer-events-none">
    <div class="absolute top-1/3 left-1/4 w-[900px] h-[900px] bg-black/10 rounded-full blur-[180px]"></div>
    <div class="absolute top-1/4 left-1/2 w-[500px] h-[500px] bg-black/10 rounded-full blur-[140px]"></div>
    <div class="absolute bottom-[-300px] left-1/2 -translate-x-1/2 w-[800px] h-[800px] bg-black/5 rounded-full blur-[200px]"></div>
  </div>

  <!-- NAVBAR -->
  <nav class="fixed top-0 left-0 w-full z-50 border-b border-neutral-200 bg-white">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="text-black text-sm font-medium tracking-wide">Stay Here</div>

      <ul class="hidden md:flex items-center gap-8 text-sm">
        <li><a href="index.html" class="hover:text-neutral-600">Home</a></li>
        <li><a href="daily.html" class="text-black font-medium">Daily Words</a></li>
        <li><a href="game.html" class="hover:text-neutral-600">Game</a></li>
        <li><a href="music.html" class="hover:text-neutral-600">Music</a></li>
      </ul>

      <button id="menu-btn" class="md:hidden text-xl">☰</button>
    </div>

    <div id="mobile-menu" class="hidden md:hidden border-t border-neutral-200 bg-white">
      <ul class="flex flex-col px-6 py-6 gap-4 text-sm">
        <li><a href="index.html">Home</a></li>
        <li><a href="daily.html">Daily Words</a></li>
        <li><a href="game.html">Game</a></li>
        <li><a href="music.html">Music</a></li>
      </ul>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="flex-1 flex items-center justify-center px-6 pt-32 pb-24">
    <div class="max-w-2xl w-full text-center" data-aos="fade-up">

      <!-- QUOTE -->
      <blockquote
        id="quote"
        class="text-2xl md:text-4xl font-serif text-neutral-900 leading-relaxed transition-opacity duration-700"
      >
        …
      </blockquote>

      <!-- ACTIONS -->
      <div id="actions" class="mt-12 flex justify-center gap-4">
        <button
          id="sitBtn"
          class="px-6 py-3 border rounded-full text-sm hover:bg-neutral-100"
        >
          Sit with this
        </button>

        <button
          id="nextBtn"
          class="px-6 py-3 bg-black text-white rounded-full text-sm"
        >
          Another message
        </button>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="max-w-7xl mx-auto px-6 py-6 text-center text-sm text-neutral-500">
      © Stay Here. All rights reserved.
    </div>
  </footer>

<!-- AOS SCRIPT (WAJIB) -->
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", () => {

    AOS.init();

    const btn = document.getElementById("menu-btn");
    const menu = document.getElementById("mobile-menu");
    btn.addEventListener("click", () => menu.classList.toggle("hidden"));

    let quotes = [];
    let index = 0;
    let timer = null;

    const quoteEl = document.getElementById("quote");
    const actionsEl = document.getElementById("actions");

    async function loadQuotes() {
      try {
        const res = await fetch("quotes.json");
        if (!res.ok) throw new Error("Fetch failed");

        const data = await res.json();

        if (Array.isArray(data)) {
          quotes = data;
        } else if (Array.isArray(data.quotes)) {
          quotes = data.quotes;
        } else {
          throw new Error("Invalid JSON format");
        }

      } catch (err) {
        console.error("JSON ERROR:", err);
        quotes = [
  "Growth is often a quiet, invisible process.",
  "You are allowed to be a masterpiece and a work in progress simultaneously.",
  "Small steps still cover ground.",
  "Your worth is not a variable of your output.",
  "Healing isn't linear, and that’s not a sign of weakness.",
  "The version of you that survived is allowed to be tired.",
  "You don't owe anyone a 'perfect' version of your struggle.",
  "Quiet progress is still progress.",
  "Your potential doesn't have an expiration date.",
  "It is okay to outgrow people who aren't ready to grow.",
  "Ambition and peace can occupy the same space.",
  "You are not a machine designed for constant optimization.",
  "The noise of the world doesn't define your inner signal.",
  "Self-compassion is the most practical tool you own.",
  "You don't need to be 'on' to be valuable.",
  "The sun doesn't apologize for disappearing at night.",
  "Complexity is not a flaw; it is your humanity.",
  "You are the architect, not just the building.",
  "Success is personal; don't use someone else's ruler.",
  "It’s okay if your only win today was staying kind.",
  "Burnout is not a badge of honor.",
  "The world can wait while you find your center.",
  "You are more than the sum of your mistakes.",
  "Consistency is better than intensity.",
  "Your boundaries are not walls; they are gates.",
  "Deep breaths are productive work.",
  "You aren't 'behind'; you are on your own timeline.",
  "Gentleness is a form of strength.",
  "Not every seed blooms in the same season.",
  "Your inner peace is worth the inconvenience of others.",
  "Stop trying to fix a version of you that isn't broken.",
  "Loneliness is sometimes just a craving for your own company.",
  "You are allowed to change your mind about who you want to be.",
  "Don't trade your authenticity for approval.",
  "The most important conversation is the one you have with yourself.",
  "Rest is a strategy, not an escape.",
  "You are capable of doing hard things with a soft heart.",
  "Vulnerability is the highest form of courage.",
  "Your story isn't over just because a chapter ended poorly.",
  "You don't have to be loud to be heard.",
  "Curiosity is the antidote to fear.",
  "Forgive yourself for the things you didn't know then.",
  "Your value is inherent, not earned.",
  "Comparison is a thief that works in shadows.",
  "It is okay to be a slow burner in a world of flashes.",
  "The view changes when you stop running.",
  "You are allowed to take up space.",
  "Patience is just trust with a longer timeline.",
  "Your struggle is real, but it is not your identity.",
  "Excellence does not require perfection.",
  "Be the person you needed when you were younger.",
  "The most beautiful gardens have messy soil.",
  "You don't need a map to move forward; just a compass.",
  "Your feelings are data, not directives.",
  "It’s okay to start over at 4 PM.",
  "Strength isn't always a roar; sometimes it's a quiet 'try again'.",
  "You are allowed to say 'no' without a long explanation.",
  "The gap between where you are and where you want to be is room to grow.",
  "Kindness to yourself is non-negotiable.",
  "You are not responsible for the versions of you that exist in other people's heads.",
  "Dreams don't have to be big to be meaningful.",
  "Sometimes the most productive thing you can do is sleep.",
  "You are the sky; everything else is just weather.",
  "Don't let the 'shoulds' bury your 'wants'.",
  "A detour is still a path.",
  "You are allowed to be happy before you reach the goal.",
  "Clarity comes from movement, not just thinking.",
  "Your intuition is a muscle; use it.",
  "The most resilient trees bend in the wind.",
  "You don't need to be fixed because you aren't a broken object.",
  "Your presence is a contribution.",
  "The cost of 'fitting in' is often yourself.",
  "Slow growth creates the strongest roots.",
  "Your life is not a performance for an audience.",
  "It’s okay to not have an opinion on everything.",
  "The finish line is wherever you decide it is.",
  "You are allowed to mourn the person you used to be.",
  "Peace is a practice, not a destination.",
  "Your sensitivity is a superpower, not a burden.",
  "Don't let a bad day convince you that you have a bad life.",
  "You are the authority of your own experience.",
  "The unknown is where the magic happens.",
  "Self-care is a discipline, not a luxury.",
  "You don't have to prove your pain to have it validated.",
  "Focus on the 'how', and the 'why' will follow.",
  "Your joy is allowed to be simple.",
  "The weight you carry isn't all yours to hold.",
  "You are allowed to be 'too much' for people who aren't enough for themselves.",
  "Success without soul is just noise.",
  "Your body is a home, not a project.",
  "It’s okay to be a beginner at something new.",
  "The light you seek is already within you.",
  "You are not your productivity levels.",
  "Give yourself permission to be human.",
  "The best time to be kind to yourself is when you least deserve it.",
  "You are enough, exactly as you are, right now.",
  "Trust the timing of your unfolding.",
  "You don't need to earn the air you breathe.",
  "Silence is a valid response.",
  "Keep going; the world needs your unique light."
];
      }

      showQuote();
      startRotation();
      renderDefaultButtons();
    }

    function showQuote() {
      quoteEl.classList.add("opacity-0");
      setTimeout(() => {
        quoteEl.textContent = `“${quotes[index]}”`;
        quoteEl.classList.remove("opacity-0");
      }, 400);
    }

    function startRotation() {
      stopRotation();
      timer = setInterval(() => {
        index = (index + 1) % quotes.length;
        showQuote();
      }, 20000);
    }

    function stopRotation() {
      if (timer) clearInterval(timer);
      timer = null;
    }

    function renderDefaultButtons() {
      actionsEl.innerHTML = `
        <button id="sitBtn" class="px-6 py-3 border rounded-full text-sm hover:bg-neutral-100">
          Sit with this
        </button>
        <button id="nextBtn" class="px-6 py-3 bg-black text-white rounded-full text-sm">
          Another message
        </button>
      `;

      document.getElementById("sitBtn").onclick = () => {
        stopRotation();
        actionsEl.innerHTML = `
          <button id="resumeBtn" class="px-6 py-3 bg-black text-white rounded-full text-sm">
            Another message
          </button>
        `;
        document.getElementById("resumeBtn").onclick = () => {
          renderDefaultButtons();
          startRotation();
        };
      };

      document.getElementById("nextBtn").onclick = () => {
        index = (index + 1) % quotes.length;
        showQuote();
      };
    }

    loadQuotes();

  });
   let audio = new Audio();
  audio.loop = true;
  audio.volume = 0.4;

  // Load saved music
  const savedMusic = localStorage.getItem("bg-music");
  const savedTime = localStorage.getItem("bg-time");
  const isPlaying = localStorage.getItem("bg-playing");

  if (savedMusic) {
    audio.src = `music/${savedMusic}.mp3`;
    audio.currentTime = savedTime ? parseFloat(savedTime) : 0;

    if (isPlaying === "true") {
      audio.play();
    }
  }

  // Save time continuously
  audio.addEventListener("timeupdate", () => {
    localStorage.setItem("bg-time", audio.currentTime);
  });

  // Global function
  window.playMusic = function (name) {
    if (audio.src.includes(name)) return;

    audio.src = `music/${name}.mp3`;
    audio.currentTime = 0;
    audio.play();

    localStorage.setItem("bg-music", name);
    localStorage.setItem("bg-playing", "true");
  };
</script>


</body>
</html>
