<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
  <title>Gentle Choice - Stay Here</title>
</head>

<body class="relative bg-white min-h-screen flex flex-col px-4 sm:px-6">

<!-- BACKGROUND GLOW -->
<div class="fixed inset-0 -z-10 pointer-events-none">
  <div class="absolute top-1/3 left-1/4 w-[850px] h-[850px] bg-black/10 rounded-full blur-[180px]"></div>
  <div class="absolute bottom-[-300px] left-1/2 -translate-x-1/2 w-[700px] h-[700px] bg-black/5 rounded-full blur-[200px]"></div>
</div>

<!-- NAVBAR -->
<nav class="fixed top-0 left-0 w-full z-50 border-b border-neutral-200 bg-white">
  <div class="max-w-7xl mx-auto flex items-center justify-between px-4 sm:px-6 lg:px-8 py-3 sm:py-4">
    <div class="text-sm font-medium">Stay Here</div>

    <!-- Desktop Menu -->
    <ul class="hidden md:flex gap-6 lg:gap-8 text-sm items-center">
      <li><a href="index.html" class="hover:text-neutral-700">Home</a></li>
      <li><a href="daily.html" class="hover:text-neutral-700">Daily Words</a></li>
      <li><a href="game.html" class="font-medium hover:text-neutral-700">Game</a></li>
      <li><a href="music.html" class="hover:text-neutral-700">Music</a></li>
    </ul>

    <!-- Mobile Menu Button -->
    <button id="menu-btn" class="md:hidden text-2xl">☰</button>
  </div>

  <!-- Mobile Menu -->
  <div id="mobile-menu" class="hidden md:hidden border-t border-neutral-200 bg-white">
    <ul class="flex flex-col px-4 sm:px-6 py-4 gap-3 text-sm">
      <li><a href="index.html" class="block hover:text-neutral-700">Home</a></li>
      <li><a href="daily.html" class="block hover:text-neutral-700">Daily Words</a></li>
      <li><a href="game.html" class="block font-medium hover:text-neutral-700">Game</a></li>
      <li><a href="music.html" class="block hover:text-neutral-700">Music</a></li>
    </ul>
  </div>
</nav>

<!-- MAIN -->
<main class="flex-1 flex items-center justify-center pt-32 pb-24 sm:pt-36 sm:pb-28 md:pt-40 md:pb-32 px-4 sm:px-6">
  <div class="max-w-xl w-full text-center" data-aos="fade-up">

    <!-- STEP 1 -->
    <div id="step-question">
      <h1 class="text-3xl sm:text-4xl font-serif mb-6">Gentle Choice</h1>
      <p class="text-neutral-600 text-sm sm:text-base mb-10">
        What feels most kind to you right now?
      </p>

      <div class="flex flex-col gap-4">
        <button class="choice-btn">Rest for a moment</button>
        <button class="choice-btn">Do one small thing</button>
        <button class="choice-btn">Let today be enough</button>
      </div>
    </div>

    <!-- STEP 2 -->
    <div id="step-result" class="hidden">
      <blockquote
        id="resultText"
        class="text-xl sm:text-2xl md:text-3xl font-serif leading-relaxed mb-10"
      ></blockquote>

      <p class="text-neutral-600 text-sm sm:text-base mb-8">
        There was no wrong answer.
      </p>

      <button
        onclick="location.reload()"
        class="px-6 py-3 border rounded-full text-sm hover:bg-neutral-100 transition"
      >
        Make another gentle choice
      </button>
    </div>

  </div>
</main>

<!-- FOOTER -->
<footer class="text-center text-sm text-neutral-500 py-6 sm:py-8">
  © Stay Here
</footer>

<!-- SCRIPT -->
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
AOS.init();

/* MOBILE MENU TOGGLE */
const menuBtn = document.getElementById("menu-btn");
const mobileMenu = document.getElementById("mobile-menu");
menuBtn.addEventListener("click", () => mobileMenu.classList.toggle("hidden"));

/* GENTLE CHOICE LOGIC */
const buttons = document.querySelectorAll(".choice-btn");
const questionStep = document.getElementById("step-question");
const resultStep = document.getElementById("step-result");
const resultText = document.getElementById("resultText");

buttons.forEach(btn => {
  btn.className = "choice-btn px-6 py-4 border rounded-xl text-sm hover:bg-neutral-100 transition";
  btn.onclick = () => {
    resultText.textContent = `“${btn.textContent}” feels right for you.`;
    questionStep.classList.add("hidden");
    resultStep.classList.remove("hidden");
  };
});

/* GLOBAL BACKGROUND MUSIC */
let audio = new Audio();
audio.loop = true;
audio.volume = 0.4;

const savedMusic = localStorage.getItem("bg-music");
const savedTime = localStorage.getItem("bg-time");
const isPlaying = localStorage.getItem("bg-playing");

if (savedMusic && isPlaying === "true") {
  audio.src = `music/${savedMusic}.mp3`;
  audio.currentTime = savedTime ? parseFloat(savedTime) : 0;
  audio.play().catch(() => {});
}

audio.addEventListener("timeupdate", () => {
  localStorage.setItem("bg-time", audio.currentTime);
});

window.playMusic = function (name) {
  if (audio.src.includes(name)) return;
  audio.src = `music/${name}.mp3`;
  audio.currentTime = 0;
  audio.play();
  localStorage.setItem("bg-music", name);
  localStorage.setItem("bg-playing", "true");
};
</script>

</body>
</html>
