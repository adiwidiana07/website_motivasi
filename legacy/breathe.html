<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
  <title>Games - Stay Here</title>
</head>

<body class="relative bg-white min-h-screen flex flex-col">

  <!-- BACKGROUND -->
  <div class="fixed inset-0 -z-10 pointer-events-none">
    <div class="absolute top-1/3 left-1/4 w-[900px] h-[900px] bg-black/10 rounded-full blur-[180px]"></div>
    <div class="absolute top-1/4 left-1/2 w-[500px] h-[500px] bg-black/10 rounded-full blur-[140px]"></div>
    <div class="absolute bottom-[-300px] left-1/2 -translate-x-1/2 w-[800px] h-[800px] bg-black/5 rounded-full blur-[200px]"></div>
  </div>

<!-- NAVBAR -->
<nav class="fixed top-0 left-0 w-full z-50 border-b border-neutral-200 bg-white">
  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
    <div class="text-black text-sm font-medium tracking-wide">Stay Here</div>

    <!-- DESKTOP MENU -->
    <ul class="hidden md:flex items-center gap-8 text-sm">
      <li><a href="index.html" class="hover:text-neutral-600">Home</a></li>
      <li><a href="daily.html" class="hover:text-neutral-600">Daily Words</a></li>
      <li><a href="game.html" class="text-black font-medium">Game</a></li>
      <li><a href="music.html" class="hover:text-neutral-600">Music</a></li>
    </ul>

    <!-- MOBILE BUTTON -->
    <button id="menu-btn" class="md:hidden text-xl">☰</button>
  </div>

  <!-- MOBILE MENU -->
  <div id="mobile-menu" class="hidden md:hidden border-t border-neutral-200 bg-white">
    <ul class="flex flex-col px-6 py-6 gap-4 text-sm">
      <li><a href="index.html">Home</a></li>
      <li><a href="daily.html">Daily Words</a></li>
      <li><a href="game.html">Game</a></li>
      <li><a href="music.html">Music</a></li>
    </ul>
  </div>
</nav>

  <!-- MAIN -->
  <main class="flex-1 flex items-center justify-center pt-32 pb-20">
    <div class="text-center max-w-md">

      <h1 class="text-3xl font-serif mb-8">Breathe</h1>

      <div
        id="circle"
        class="w-48 h-48 mx-auto rounded-full border flex items-center justify-center text-xl transition-all"
      >
        Ready
      </div>

      <button
        id="startBtn"
        class="mt-10 px-6 py-3 bg-black text-white rounded-full text-sm"
      >
        Start
      </button>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="text-center text-sm text-neutral-500 py-6">
    © Stay Here. All rights reserved.
  </footer>

  <!-- SCRIPT -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init();

    // NAVBAR
    const menuBtn = document.getElementById("menu-btn");
    const menu = document.getElementById("mobile-menu");
    menuBtn.onclick = () => menu.classList.toggle("hidden");

    // BREATHE GAME
    const circle = document.getElementById("circle");
    const startBtn = document.getElementById("startBtn");

    const steps = [
      { text: "Inhale", scale: "scale-125", time: 4000 },
      { text: "Hold", scale: "scale-125", time: 3000 },
      { text: "Exhale", scale: "scale-100", time: 5000 }
    ];

    let index = 0;
    let running = false;

    function runStep() {
      if (!running) return;

      const step = steps[index];
      circle.textContent = step.text;
      circle.className =
        `w-48 h-48 mx-auto rounded-full border flex items-center justify-center text-xl transition-all duration-[${step.time}ms] ${step.scale}`;

      setTimeout(() => {
        index = (index + 1) % steps.length;
        runStep();
      }, step.time);
    }

    startBtn.onclick = () => {
      if (running) return;
      running = true;
      startBtn.remove();
      runStep();
    };
     let audio = new Audio();
  audio.loop = true;
  audio.volume = 0.4;

  // Load saved music
  const savedMusic = localStorage.getItem("bg-music");
  const savedTime = localStorage.getItem("bg-time");
  const isPlaying = localStorage.getItem("bg-playing");

  if (savedMusic) {
    audio.src = `music/${savedMusic}.mp3`;
    audio.currentTime = savedTime ? parseFloat(savedTime) : 0;

    if (isPlaying === "true") {
      audio.play();
    }
  }

  // Save time continuously
  audio.addEventListener("timeupdate", () => {
    localStorage.setItem("bg-time", audio.currentTime);
  });

  // Global function
  window.playMusic = function (name) {
    if (audio.src.includes(name)) return;

    audio.src = `music/${name}.mp3`;
    audio.currentTime = 0;
    audio.play();

    localStorage.setItem("bg-music", name);
    localStorage.setItem("bg-playing", "true");
  };
  </script>

</body>
</html>
