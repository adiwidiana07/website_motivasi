<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>Music - Stay Here</title>
</head>

<body class="relative bg-white min-h-screen flex flex-col px-4 sm:px-6">

<!-- BACKGROUND -->
<div class="fixed inset-0 -z-10 pointer-events-none">
  <div class="absolute top-1/3 left-1/4 w-[800px] h-[800px] bg-black/10 rounded-full blur-[180px]"></div>
</div>

<!-- NAVBAR -->
<nav class="fixed top-0 left-0 w-full z-50 border-b border-neutral-200 bg-white">
  <div class="max-w-7xl mx-auto flex items-center justify-between px-4 sm:px-6 lg:px-8 py-3 sm:py-4">
    <div class="text-sm font-medium">Stay Here</div>

    <!-- Desktop Menu -->
    <ul class="hidden md:flex gap-6 lg:gap-8 text-sm items-center">
      <li><a href="index.html" class="hover:text-neutral-700">Home</a></li>
      <li><a href="daily.html" class="hover:text-neutral-700">Daily Words</a></li>
      <li><a href="game.html" class="hover:text-neutral-700">Game</a></li>
      <li><a href="music.html" class="font-medium hover:text-neutral-700">Music</a></li>
    </ul>

    <!-- Mobile Menu Button -->
    <button id="menu-btn" class="md:hidden text-2xl">☰</button>
  </div>

  <!-- Mobile Menu -->
  <div id="mobile-menu" class="hidden md:hidden border-t border-neutral-200 bg-white">
    <ul class="flex flex-col px-4 sm:px-6 py-4 gap-3 text-sm">
      <li><a href="index.html" class="block hover:text-neutral-700">Home</a></li>
      <li><a href="daily.html" class="block hover:text-neutral-700">Daily Words</a></li>
      <li><a href="game.html" class="block hover:text-neutral-700">Game</a></li>
      <li><a href="music.html" class="block hover:text-neutral-700">Music</a></li>
    </ul>
  </div>
</nav>

<!-- MAIN -->
<main class="flex-1 flex items-center justify-center pt-32 pb-24 sm:pt-36 sm:pb-28 md:pt-40 md:pb-32 px-4 sm:px-6">
  <div class="max-w-md w-full text-center">

    <h1 class="text-3xl sm:text-4xl font-serif mb-6">Background Music</h1>
    <p class="text-neutral-600 text-sm sm:text-base mb-10">
      Choose a sound that feels gentle to you.
    </p>

    <div class="flex flex-col gap-4">
      <button data-music="calm-1" class="music-btn">Rewrite The Stars</button>
      <button data-music="calm-2" class="music-btn">Bohong Hati</button>
      <button data-music="calm-3" class="music-btn">Mast Magan</button>
    </div>

    <p id="status" class="text-sm sm:text-base text-neutral-500 mt-8"></p>

  </div>
</main>

<footer class="text-center text-sm sm:text-base text-neutral-500 py-6 sm:py-8">
  © Stay Here
</footer>

<!-- SCRIPT -->
<script>
  // Mobile menu toggle
  const menuBtn = document.getElementById("menu-btn");
  const mobileMenu = document.getElementById("mobile-menu");
  menuBtn.addEventListener("click", () => mobileMenu.classList.toggle("hidden"));

  // Music buttons
  const buttons = document.querySelectorAll(".music-btn");
  const status = document.getElementById("status");
  let audio = new Audio();
  audio.loop = true;
  audio.volume = 0.4;

  buttons.forEach(btn => {
    btn.className = "music-btn px-6 py-4 border rounded-xl text-sm sm:text-base hover:bg-neutral-100 transition";

    btn.onclick = () => {
      const name = btn.dataset.music;
      localStorage.setItem("bg-music", name);
      playMusic(name);
      status.textContent = "Background music is playing.";
    };
  });

  function playMusic(name) {
    audio.pause();
    audio.src = `music/${name}.mp3`;
    audio.currentTime = 0;
    audio.play();
  }

  // Auto-play saved music
  const saved = localStorage.getItem("bg-music");
  if (saved) {
    playMusic(saved);
    status.textContent = "Background music is playing.";
  }
</script>

</body>
</html>
