<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
  <title>One Thought - Stay Here</title>
</head>

<body class="relative bg-white min-h-screen flex flex-col px-4 sm:px-6">

<!-- BACKGROUND GLOW -->
<div class="fixed inset-0 -z-10 pointer-events-none">
  <div class="absolute top-1/3 left-1/4 w-[800px] h-[800px] bg-black/10 rounded-full blur-[180px]"></div>
  <div class="absolute bottom-[-300px] left-1/2 -translate-x-1/2 w-[700px] h-[700px] bg-black/5 rounded-full blur-[200px]"></div>
</div>

<!-- NAVBAR -->
<nav class="fixed top-0 left-0 w-full z-50 border-b border-neutral-200 bg-white">
  <div class="max-w-7xl mx-auto flex items-center justify-between px-4 sm:px-6 lg:px-8 py-3 sm:py-4">
    <div class="text-sm font-medium">Stay Here</div>

    <!-- Desktop Menu -->
    <ul class="hidden md:flex gap-6 lg:gap-8 text-sm items-center">
      <li><a href="index.html" class="hover:text-neutral-700">Home</a></li>
      <li><a href="daily.html" class="hover:text-neutral-700">Daily Words</a></li>
      <li><a href="game.html" class="font-medium hover:text-neutral-700">Game</a></li>
      <li><a href="music.html" class="hover:text-neutral-700">Music</a></li>
    </ul>

    <!-- Mobile Menu Button -->
    <button id="menu-btn" class="md:hidden text-2xl">☰</button>
  </div>

  <!-- Mobile Menu -->
  <div id="mobile-menu" class="hidden md:hidden border-t border-neutral-200 bg-white">
    <ul class="flex flex-col px-4 sm:px-6 py-4 gap-3 text-sm">
      <li><a href="index.html" class="block hover:text-neutral-700">Home</a></li>
      <li><a href="daily.html" class="block hover:text-neutral-700">Daily Words</a></li>
      <li><a href="game.html" class="block font-medium hover:text-neutral-700">Game</a></li>
      <li><a href="music.html" class="block hover:text-neutral-700">Music</a></li>
    </ul>
  </div>
</nav>

<!-- MAIN -->
<main class="flex-1 flex items-center justify-center pt-32 pb-24 sm:pt-36 sm:pb-28 md:pt-40 md:pb-32 px-4 sm:px-6">
  <div class="max-w-xl w-full text-center" data-aos="fade-up">

    <!-- STEP 1 -->
    <div id="step-input">
      <h1 class="text-3xl sm:text-4xl font-serif mb-6">One Thought</h1>
      <p class="text-neutral-600 text-sm sm:text-base mb-8">
        Write one thought that feels heavy right now.
      </p>

      <textarea
        id="thoughtInput"
        class="w-full border rounded-xl p-4 text-sm sm:text-base focus:outline-none"
        rows="3"
        placeholder="Just one thought…"
      ></textarea>

      <button
        id="submitThought"
        class="mt-6 px-6 py-3 sm:px-8 sm:py-4 bg-black text-white rounded-full text-sm sm:text-base hover:bg-neutral-800 transition"
      >
        Sit with this
      </button>
    </div>

    <!-- STEP 2 -->
    <div id="step-sit" class="hidden">
      <p class="text-neutral-500 text-sm sm:text-base mb-4">Stay with this thought</p>
      <blockquote
        id="thoughtDisplay"
        class="text-2xl sm:text-3xl md:text-4xl font-serif leading-relaxed mb-10"
      ></blockquote>

      <p id="timer" class="text-sm sm:text-base text-neutral-500">20</p>
    </div>

    <!-- STEP 3 -->
    <div id="step-release" class="hidden">
      <p class="text-neutral-600 text-sm sm:text-base mb-6">
        You don’t need to solve it right now.
      </p>

      <button
        onclick="location.reload()"
        class="px-6 py-3 sm:px-8 sm:py-4 border rounded-full text-sm sm:text-base hover:bg-neutral-100 transition"
      >
        Another thought
      </button>
    </div>

  </div>
</main>

<!-- FOOTER -->
<footer class="text-center text-sm sm:text-base text-neutral-500 py-6 sm:py-8">
  © Stay Here
</footer>

<!-- SCRIPT -->
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
AOS.init();

/* MOBILE MENU TOGGLE */
const menuBtn = document.getElementById("menu-btn");
const mobileMenu = document.getElementById("mobile-menu");
menuBtn.addEventListener("click", () => mobileMenu.classList.toggle("hidden"));

/* ONE THOUGHT LOGIC */
const inputStep = document.getElementById("step-input");
const sitStep = document.getElementById("step-sit");
const releaseStep = document.getElementById("step-release");

const thoughtInput = document.getElementById("thoughtInput");
const thoughtDisplay = document.getElementById("thoughtDisplay");
const timerEl = document.getElementById("timer");

document.getElementById("submitThought").onclick = () => {
  if (!thoughtInput.value.trim()) return;

  thoughtDisplay.textContent = `“${thoughtInput.value.trim()}”`;

  inputStep.classList.add("hidden");
  sitStep.classList.remove("hidden");

  startTimer();
};

function startTimer() {
  let time = 20;
  timerEl.textContent = time;

  const interval = setInterval(() => {
    time--;
    timerEl.textContent = time;

    if (time === 0) {
      clearInterval(interval);
      sitStep.classList.add("hidden");
      releaseStep.classList.remove("hidden");
    }
  }, 1000);
}

/* GLOBAL BACKGROUND MUSIC */
let audio = new Audio();
audio.loop = true;
audio.volume = 0.4;

const savedMusic = localStorage.getItem("bg-music");
const savedTime = localStorage.getItem("bg-time");
const isPlaying = localStorage.getItem("bg-playing");

if (savedMusic) {
  audio.src = `music/${savedMusic}.mp3`;
  audio.currentTime = savedTime ? parseFloat(savedTime) : 0;

  if (isPlaying === "true") {
    audio.play().catch(() => {});
  }
}

audio.addEventListener("timeupdate", () => {
  localStorage.setItem("bg-time", audio.currentTime);
});

window.playMusic = function (name) {
  if (audio.src.includes(name)) return;

  audio.src = `music/${name}.mp3`;
  audio.currentTime = 0;
  audio.play();

  localStorage.setItem("bg-music", name);
  localStorage.setItem("bg-playing", "true");
};
</script>

</body>
</html>
